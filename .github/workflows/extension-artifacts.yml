name: Extension Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Validate release tag version
        run: npm run release:version:tag-check

      - name: Verify, smoke, and package extensions
        run: xvfb-run --auto-servernum npm run release:check

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: aid-extension-packages
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS-*.txt
          if-no-files-found: error

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/*.zip
          artifacts/SHA256SUMS-*.txt
          --verify-tag
          --generate-notes
          --latest
